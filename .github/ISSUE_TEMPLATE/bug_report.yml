name: Bug Report
description: Report a bug or unexpected behaviour
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill this out as completely as possible. Do not post secrets, private records, or other sensitive data. For PharmaSim, use only fictional, non-identifying data. For suspected security vulnerabilities, do not use this public form; follow the affected repository's private reporting instructions.

  - type: dropdown
    id: project
    attributes:
      label: Project
      description: Which project is affected?
      options:
        - Cordite Wars — Six Fronts
        - Untitled Trust Builder
        - PharmaSim
        - Unshelv'd
        - Vetviona
        - KoshkiKode website (studio site)
        - Other / cross-project
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App / site version or commit
      description: Include a release, commit, or build identifier if known; leave blank if not applicable.
      placeholder: e.g. 1.2.0 or main@abc1234

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where does this happen?
      multiple: true
      options:
        - Web (browser)
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
        - All platforms
        - Other / not applicable
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reliably reproduce the bug.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Share relevant logs or screenshots after removing secrets and personal, family, or patient data.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: OS, browser, device model, app version, or anything else that might help.
